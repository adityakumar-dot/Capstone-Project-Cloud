groups:
  - name: instance_health
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "The service {{ $labels.job }} has been unreachable for 1 minute."

      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "High CPU detected on {{ $labels.instance }}"
          description: "CPU usage is above 80% (current: {{ $value }}%) for 5 minutes."

      - alert: HighMemoryUsage
        expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
          component: host
        annotations:
          summary: "High Memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% (current: {{ $value }}%)."

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
          component: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 15% (current: {{ $value }}%)."

      - alert: HighAPILatency
        expr: histogram_quantile(0.99, sum(rate(nginx_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency detected"
          description: "99th percentile latency is above 1 second (current: {{ $value }}s)."

      - alert: BackendServiceDown
        expr: up{job="backend_services"} == 0
        for: 30s
        labels:
          severity: critical
          component: backend
        annotations:
          summary: "Backend service {{ $labels.instance }} is down"
          description: "The backend service has been unreachable for 30 seconds."