global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alerts.yml'

scrape_configs:

  # EC2 host metrics (CPU, Memory, Disk)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'backend-ec2'

  # Container metrics (all running containers)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8081']
        labels:
          instance: 'backend-ec2'

  # FastAPI health
  - job_name: 'fastapi'
    metrics_path: '/health/live'
    static_configs:
      - targets: ['python-fastapi:8000']
        labels:
          service: 'fastapi'

  # Node.js health
  - job_name: 'nodejs'
    metrics_path: '/health/live'
    static_configs:
      - targets: ['nodejs:3000']
        labels:
          service: 'nodejs'

  # Django health
  - job_name: 'django'
    metrics_path: '/health/live'
    static_configs:
      - targets: ['python-django:8001']
        labels:
          service: 'django'

  # .NET health
  - job_name: 'dotnet'
    metrics_path: '/health/live'
    static_configs:
      - targets: ['dotnet-webapi:5000']
        labels:
          service: 'dotnet'

  # Prometheus self
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']