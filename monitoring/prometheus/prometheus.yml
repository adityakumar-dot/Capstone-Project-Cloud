global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'backend_services'
    metrics_path: '/metrics'
    static_configs:
      - targets: 
        - 'python-fastapi:8000'
        - 'nodejs:3000'
        - 'python-django:8001'
        - 'dotnet-webapi:5000'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
