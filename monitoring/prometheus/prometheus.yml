global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project: 'cloud3tier'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
      api_version: v2

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host-metrics'
          type: 'infrastructure'

  - job_name: 'nginx_exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
          type: 'web-server'

  - job_name: 'backend_services'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'python-fastapi:8000'
        - 'nodejs:3000'
        - 'python-django:8001'
        - 'dotnet-webapi:5000'
        labels:
          tier: 'backend'