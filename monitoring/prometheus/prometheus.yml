global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['cloud3tier-alertmanager:9093']

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['cloud3tier-node-exporter:9100']
        labels:
          instance: 'backend-ec2'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cloud3tier-cadvisor:8080']
        labels:
          instance: 'backend-ec2'

  - job_name: 'nginx'
    static_configs:
      - targets: ['cloud3tier-nginx-exporter:9113']
        labels:
          instance: 'backend-ec2'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Service UP/DOWN via blackbox-style HTTP probe ──────────────
  - job_name: 'fastapi'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://cloud3tier-fastapi:8000/health']
        labels:
          service: 'fastapi'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: cloud3tier-blackbox:9115

  - job_name: 'nodejs'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://cloud3tier-nodejs:3000/health/live']
        labels:
          service: 'nodejs'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: cloud3tier-blackbox:9115

  - job_name: 'django'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://cloud3tier-django:8001/health/live']
        labels:
          service: 'django'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: cloud3tier-blackbox:9115

  - job_name: 'dotnet'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://cloud3tier-dotnet:5000/health/live']
        labels:
          service: 'dotnet'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: cloud3tier-blackbox:9115