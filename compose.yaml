services:
  python-fastapi:
    image: ${ECR_REGISTRY}/python-fastapi:${IMAGE_TAG}
    container_name: cloud3tier-fastapi
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - monitoring

  nodejs:
    image: ${ECR_REGISTRY}/nodejs:${IMAGE_TAG}
    container_name: cloud3tier-nodejs
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - monitoring

  python-django:
    image: ${ECR_REGISTRY}/python-django:${IMAGE_TAG}
    container_name: cloud3tier-django
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - monitoring

  dotnet-webapi:
    image: ${ECR_REGISTRY}/dotnet-webapi:${IMAGE_TAG}
    container_name: cloud3tier-dotnet
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - monitoring

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      python-fastapi:
        condition: service_healthy
      nodejs:
        condition: service_healthy
      python-django:
        condition: service_healthy
      dotnet-webapi:
        condition: service_healthy
    networks:
      - monitoring
  
networks:
  monitoring:
    driver: bridge

