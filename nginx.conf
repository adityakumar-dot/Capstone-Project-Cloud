events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format simple_upstream '$remote_addr "$request" $status upstream=$upstream_addr';
    access_log /var/log/nginx/access.log simple_upstream;

    # Define upstream group for Round Robin mode
    upstream backend_servers {
        server python-fastapi:8000;
        server nodejs:3000;
        server python-django:8001;
        server dotnet-webapi:5000;
    }

    server {
        listen 80;
        server_name _;


        # ─── Nginx stub_status for Prometheus exporter ───────────────
        location /nginx_status {
            stub_status;
            allow 172.0.0.0/8;   # Docker bridge network
            allow 10.0.0.0/8;    # Internal networks
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            access_log off;
        }

        # ─── Grafana (accessed via LB at /grafana/) ─────────────────
        location /grafana/ {
            resolver 127.0.0.11 valid=10s;
            set $grafana http://grafana:3000;
            proxy_pass $grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Alertmanager UI (accessed via LB at /alertmanager/) ─────
        location /alertmanager/ {
            resolver 127.0.0.11 valid=10s;
            set $alertmanager http://alertmanager:9093;
            rewrite ^/alertmanager/(.*) /$1 break;
            proxy_pass $alertmanager;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
 

        # --- SPECIFIC BACKEND ROUTING (Prefix based) ---

        # Route to FastAPI
        location /fastapi/ {
            proxy_pass http://python-fastapi:8000/;
            # include /etc/nginx/proxy_params_custom;
        }

        # Route to Node.js
        location /nodejs/ {
            proxy_pass http://nodejs:3000/;
            # include /etc/nginx/proxy_params_custom;
        }

        # Route to Django
        location /django/ {
            proxy_pass http://python-django:8001/;
            # include /etc/nginx/proxy_params_custom;
        }

        # Route to .NET
        location /dotnet/ {
            proxy_pass http://dotnet-webapi:5000/;
            # include /etc/nginx/proxy_params_custom;
        }

        # --- ROUND ROBIN & DEFAULT ROUTING ---

        # This handles the "Round Robin" card (No prefix)
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Round Robin (Directly matches /api/...)
        location /api/ {
            proxy_pass http://backend_servers;
            # include /etc/nginx/proxy_params_custom;
        }
    }
}








